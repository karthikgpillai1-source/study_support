[project]
name = "study-intelligence-engine"
version = "0.1.0"
description = "Study Intelligence Platform backend: notes -> study intelligence -> work packages -> study plans"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
 "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3",
    "email-validator>=2.2",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "aiosqlite>=0.20",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"app/schemas/*" = ["N815"]
# Fixture notes and long assertion messages are allowed to run past the limit.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
